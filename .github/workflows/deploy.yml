name: Deploy NEXO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unzip and build
        run: |
          mkdir -p app
          unzip -o -q ./*.zip -d app
          P=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
          cd "$P"
          npm install --no-audit --no-fund
          npx vite build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "DIST_DIR=$PWD/dist" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
